# GitHub Pages への公開（SV-42。配布 URL https://servantsmendarks.github.io/wizlike/）。
# master への push と手動の実行で、テスト → ビルド（base /wizlike/）→ dist を Pages に出す。
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に 1 つだけ。走っている公開は止めずに、後の実行を待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 依存の engines（vite ^20.19 || >=22.12、vitest ^22.12 || ^24 || >=26）と手元の Node 24 に合わせる
          node-version: 24
      - run: npm ci
      - run: npm test
      # build は typecheck → vite build（tsc の 2 つの tsconfig を通す）
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
